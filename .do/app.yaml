name: swahili-news-classifier
region: fra
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    github:
      repo: eldrige/swahili-text-classifier
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /
      initial_delay_seconds: 20
    envs:
      - key: SWAHILI_MODEL
        value: baseline
        scope: RUN_TIME
